name: Daily Zendesk Conversation Scoring

on:
  schedule:
    # GitHub Actions cron runs in UTC only.
    # 13:00 UTC ≈ 8:00 AM Central Daylight Time (summer).
    # During Central Standard Time (winter), this will run ≈ 7:00 AM local instead —
    # adjust the hour below seasonally if exact 8:00 AM local time matters.
    - cron: '0 13 * * *'
  workflow_dispatch:  # allows manually triggering a run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated CSV back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python daily_zendesk_pipeline.py

      - name: Commit updated CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zendesk_conversations_scored_master.csv
          git diff --cached --quiet || git commit -m "Daily conversation scoring update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push